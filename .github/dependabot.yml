version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # Workspace-internal packages are managed via the monorepo, not Dependabot.
      - dependency-name: '@app-factory/*'
    groups:
      azure:
        patterns:
          - '@azure/*'
          - 'azure-*'
      microsoft:
        patterns:
          - '@microsoft/*'
          - 'microsoft-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
