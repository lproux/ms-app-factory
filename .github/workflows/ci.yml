name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build-test-lint (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is pinned via `packageManager` in package.json (pnpm@11.1.3).

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # Root `typecheck` script delegates to `turbo run typecheck`, which honors
        # the `^build` dependency declared in turbo.json so packages get their
        # workspace siblings' dist before tsc runs.
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm -r test

      - name: Lint (biome check — read-only)
        run: pnpm lint

      - name: Upload package dist artifacts
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist-node${{ matrix.node }}
          path: |
            packages/*/dist
            packages/skill-adapters/*/dist
          if-no-files-found: error
          retention-days: 14
